name: briefing
# 장전 뉴스 브리핑: Claude 예약 작업이 records/briefing/날짜.md 를 올리면 바로 텔레그램(같이 보는 방)으로 보냄
on:
  push:
    branches: [main]
    paths: ["records/briefing/*.md"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: briefing
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests pandas
      - name: send
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_SHARE_CHAT_ID: ${{ secrets.TELEGRAM_SHARE_CHAT_ID }}
        run: python briefing_send.py
      - name: save
        if: always()
        run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add records || true
          git diff --cached --quiet || (git commit -m "briefing sent $(date +%F)" && git pull --rebase && git push)
