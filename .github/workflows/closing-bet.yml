name: closing-bet
on:
  schedule:
    - cron: "40 5 * * 1-5"   # 14:40 KST에 깨워서 15:08까지 기다린 뒤 실행 (늦게 깨는 것 대비)
    - cron: "0 10 * * 1-5"   # 19:00 KST 저녁 정리
  workflow_dispatch:
    inputs:
      mode:
        description: "test=시험 메시지 / scan=후보 찾기(15:08 전이면 15:08까지 기다림) / evening=지금 바로 저녁 정리"
        default: test
        type: choice
        options: [test, scan, evening]
permissions:
  contents: write
concurrency: closing-bet
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests pandas
      - name: run
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ "$MODE" = "test" ]; then python telegram.py
          elif [ "$MODE" = "scan" ]; then python scan_1510.py
          elif [ "$MODE" = "evening" ]; then python evening.py --now
          elif [ "${{ github.event.schedule }}" = "0 10 * * 1-5" ]; then python evening.py
          else python scan_1510.py; fi
      - name: save records
        run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add records || true
          git diff --cached --quiet || (git commit -m "records $(date +%F)" && git pull --rebase && git push)
